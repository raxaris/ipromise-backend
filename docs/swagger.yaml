        type: string
      - description: Максимум постов
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339) для пагинации
        in: query
        name: after
        type: string
      - description: ID последнего поста
        in: query
        name: after_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
