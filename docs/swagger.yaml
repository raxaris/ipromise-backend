  /promises:
    post:
      consumes:
      - application/json
      description: Пользователь создаёт новое обещание
      parameters:
      - description: Данные обещания
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePromiseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Обещание создано'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный формат данных'
          schema:
            additionalProperties:
              type: string
