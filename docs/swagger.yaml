basePath: /
definitions:
  dto.AttachmentResponse:
    properties:
      file_type:
        description: image, pdf, etc.
        type: string
      url:
        type: string
    type: object
  dto.BadgeResponse:
    properties:
      code:
        type: string
      description:
        type: string
      icon_url:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  dto.CreateMicrotaskInput:
    properties:
      order:
        type: integer
      steps_planned:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  dto.CreateMicrotaskRequest:
    properties:
      order:
        type: integer
      steps_planned:
        type: integer
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.CreatePostRequest:
    properties:
      content:
        minLength: 1
        type: string
      parent_id:
        description: если это комментарий
        type: string
    required:
    - content
    type: object
  dto.CreatePromiseRequest:
    properties:
      deadline:
        type: string
      description:
        maxLength: 2000
        type: string
      is_private:
        type: boolean
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - deadline
    - title
    type: object
  dto.CreatePromiseWithMicrotasksRequest:
    properties:
      deadline:
        type: string
      description:
        type: string
      is_private:
        type: boolean
      microtasks:
        items:
          $ref: '#/definitions/dto.CreateMicrotaskInput'
        type: array
      title:
        type: string
    required:
    - deadline
    - title
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.MicrotaskProgress:
    properties:
      completion_ratio:
        type: number
      id:
        type: string
      order:
        type: integer
      posts_count:
        type: integer
      status:
        type: string
      steps_planned:
        type: integer
      title:
        type: string
    type: object
  dto.MicrotaskResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      order:
        type: integer
      promise_id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.MyProfileResponse:
    properties:
      avatar_url:
        type: string
      badges_count:
        type: integer
      bio:
        type: string
      email:
        type: string
      followers_count:
        type: integer
      following_count:
        type: integer
      id:
        description: UUID юзера
        type: string
      promises_count:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  dto.PostLiteResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/dto.AttachmentResponse'
        type: array
      author_id:
        type: string
      avatar_url:
        type: string
      comments:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      likes:
        type: integer
      microtask_id:
        type: string
      microtask_title:
        type: string
      promise_id:
        type: string
      promise_title:
        type: string
      username:
        type: string
    type: object
  dto.PostWithRepliesTreeResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/dto.AttachmentResponse'
        type: array
      author_id:
        type: string
      avatar_url:
        type: string
      comments:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      likes:
        type: integer
      microtask_id:
        type: string
      microtask_title:
        type: string
      promise_id:
        type: string
      promise_title:
        type: string
      replies:
        items:
          $ref: '#/definitions/dto.PostWithRepliesTreeResponse'
        type: array
      username:
        type: string
    type: object
  dto.PromiseResponse:
    properties:
      created_at:
        type: string
      deadline:
        type: string
      description:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      status:
        type: string
      title:
        type: string
      username:
        description: можно добавить позже
        type: string
    type: object
  dto.PromiseWithMicrotasksProgressResponse:
    properties:
      deadline:
        type: string
      description:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      microtasks:
        items:
          $ref: '#/definitions/dto.MicrotaskProgress'
        type: array
      status:
        type: string
      title:
        type: string
    type: object
  dto.PublicProfileResponse:
    properties:
      avatar_url:
        type: string
      badges_count:
        type: integer
      bio:
        type: string
      followers_count:
        type: integer
      following_count:
        type: integer
      id:
        type: string
      is_following:
        description: для отображения кнопки "Подписаться"
        type: boolean
      promises_count:
        type: integer
      username:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.ReorderMicrotasksMapRequest:
    properties:
      orders:
        additionalProperties:
          type: integer
        type: object
    required:
    - orders
    type: object
  dto.SignupRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - confirm_password
    - email
    - password
    - username
    type: object
  dto.UpdateMicrotaskRequest:
    properties:
      status:
        enum:
        - pending
        - in_progress
        - completed
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  dto.UpdatePostRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        description: необязательное описание
        maxLength: 160
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    type: object
  dto.UpdatePromiseRequest:
    properties:
      deadline:
        type: string
      description:
        maxLength: 2000
        type: string
      is_private:
        type: boolean
      title:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  dto.UpdateUserRequest:
    properties:
      avatar_url:
        description: Новый аватар
        type: string
      role:
        description: Только для админа
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для отслеживания обещаний пользователей.
  title: iPromise API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Логин по email и паролю, выдаёт JWT токены
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'access_token: токен, refresh_token: токен'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка валидации'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неверный email или пароль'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Авторизация пользователя
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Удаляет Refresh Token из хранилища
      parameters:
      - description: Refresh Token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Вы успешно вышли из системы'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка валидации'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Недействительный Refresh-токен'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Выход из системы
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Использует Refresh Token для выдачи нового Access Token
      parameters:
      - description: Refresh Token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'access_token: новый access-токен'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка валидации'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Недействительный Refresh-токен'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновление Access Token
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя по email, имени и паролю
      parameters:
      - description: Данные для регистрации пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Пользователь зарегистрирован'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверные данные'
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'error: Email или имя пользователя уже занято'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация нового пользователя
      tags:
      - auth
  /badges:
    get:
      description: Возвращает список всех доступных бейджей системы
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BadgeResponse'
            type: array
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить все бейджи
      tags:
      - badges
  /badges/me:
    get:
      description: Возвращает список бейджей, полученных текущим авторизованным пользователем
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BadgeResponse'
            type: array
        "401":
          description: 'error: Требуется авторизация'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить бейджи текущего пользователя
      tags:
      - badges
  /microtasks/{id}:
    delete:
      description: Удаляет микротаск (soft delete)
      parameters:
      - description: ID микротаска
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Микротаск удалён'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет прав'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить микротаск
      tags:
      - microtasks
    patch:
      consumes:
      - application/json
      description: Позволяет изменить заголовок и/или статус микротаска
      parameters:
      - description: ID микротаска
        in: path
        name: id
        required: true
        type: string
      - description: Обновляемые данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMicrotaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Микротаск обновлён'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка запроса'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет доступа'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновить микротаск
      tags:
      - microtasks
  /microtasks/{microtask_id}/posts:
    get:
      description: Возвращает все корневые посты, связанные с микротаском
      parameters:
      - description: ID микротаска
        in: path
        name: microtask_id
        required: true
        type: string
      - description: Максимальное количество
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339) для пагинации
        in: query
        name: after
        type: string
      - description: ID поста для пагинации
        in: query
        name: after_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostWithRepliesTreeResponse'
            type: array
        "400":
          description: 'error: Неверный ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет доступа'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить посты по микротаску
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Создаёт корневой пост или комментарий (если указан parent_id)
      parameters:
      - description: ID микротаска
        in: path
        name: microtask_id
        required: true
        type: string
      - description: Данные поста
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Пост создан'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный формат'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет прав доступа'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать пост или комментарий
      tags:
      - posts
  /posts/{id}:
    delete:
      description: Удаляет пост по ID (soft delete)
      parameters:
      - description: ID поста
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Пост удалён'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет прав'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить пост
      tags:
      - posts
    patch:
      consumes:
      - application/json
      description: Обновляет содержимое поста
      parameters:
      - description: ID поста
        in: path
        name: id
        required: true
        type: string
      - description: Новое содержимое
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Пост обновлён'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный формат'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет прав'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновить пост
      tags:
      - posts
  /posts/{id}/full:
    get:
      description: Возвращает пост, все его реплаи, автора, вложения и лайки
      parameters:
      - description: ID поста
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PostWithRepliesTreeResponse'
        "400":
          description: 'error: Неверный ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Пост не найден'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить пост с деревом комментариев
      tags:
      - posts
  /posts/{id}/replies:
    get:
      description: Возвращает список дочерних постов (реплаев)
      parameters:
      - description: ID родительского поста
        in: path
        name: id
        required: true
        type: string
      - description: Максимальное количество
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339) для пагинации
        in: query
        name: after
        type: string
      - description: ID поста для пагинации
        in: query
        name: after_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostWithRepliesTreeResponse'
            type: array
        "400":
          description: 'error: Неверный ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить комментарии к посту
      tags:
      - posts
  /posts/feed:
    get:
      description: Посты от тех, на кого подписан пользователь
      parameters:
      - description: Максимум постов
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339)
        in: query
        name: after
        type: string
      - description: ID последнего поста
        in: query
        name: after_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostLiteResponse'
            type: array
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Лента подписок (лайт)
      tags:
      - posts
  /posts/feed/tree:
    get:
      description: Посты с реплаями от пользователей, на которых подписан текущий
      parameters:
      - description: Максимум постов
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339)
        in: query
        name: after
        type: string
      - description: ID последнего поста
        in: query
        name: after_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostWithRepliesTreeResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Лента подписок (с деревом)
      tags:
      - posts
  /posts/public:
    get:
      description: Публичная лента постов без дерева комментариев
      parameters:
      - description: Максимум постов
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339) для пагинации
        in: query
        name: after
        type: string
      - description: ID последнего поста
        in: query
