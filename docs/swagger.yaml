  /profile/me:
    get:
      description: Возвращает расширенный профиль текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MyProfileResponse'
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
