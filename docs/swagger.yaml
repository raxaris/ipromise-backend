        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PublicProfileResponse'
        "404":
          description: 'error: Пользователь не найден'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
