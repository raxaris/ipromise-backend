      - BearerAuth: []
      summary: Обновить пользователя
      tags:
      - users
  /users/{username}:
    get:
      description: Возвращает краткую информацию о пользователе (id, username, role)
      parameters:
      - description: Имя пользователя
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь найден
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 'error: Пользователь не найден'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить пользователя по username
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
