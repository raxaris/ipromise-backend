      responses:
        "201":
          description: 'message: Обещание создано'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверные данные'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
