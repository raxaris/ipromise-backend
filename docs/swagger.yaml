  /promises/{promise_id}/posts:
    get:
      description: Возвращает все посты, относящиеся к данному промису
      parameters:
      - description: ID промиса
        in: path
        name: promise_id
        required: true
        type: string
      - description: Максимум постов
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339) пагинации
        in: query
        name: after
        type: string
      - description: ID последнего поста
        in: query
        name: after_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostWithRepliesTreeResponse'
