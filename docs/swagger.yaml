        type: integer
      - description: Дата и время (RFC3339) для пагинации
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PromiseResponse'
            type: array
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
