basePath: /
definitions:
  dto.AttachmentResponse:
    properties:
      file_type:
        type: string
      file_url:
        type: string
      id:
        type: string
    type: object
  dto.BadgeResponse:
    properties:
      code:
        type: string
      description:
        type: string
      icon_url:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  dto.CreateMicrotaskInput:
    properties:
      order:
        type: integer
      steps_planned:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  dto.CreateMicrotaskRequest:
    properties:
      order:
        type: integer
      steps_planned:
        type: integer
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - steps_planned
    - title
    type: object
  dto.CreatePromiseRequest:
    properties:
      deadline:
        type: string
      description:
        maxLength: 2000
        type: string
      is_private:
        type: boolean
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - deadline
    - title
    type: object
  dto.CreatePromiseWithMicrotasksRequest:
    properties:
      deadline:
        type: string
      description:
        type: string
      is_private:
        type: boolean
      microtasks:
        items:
          $ref: '#/definitions/dto.CreateMicrotaskInput'
        type: array
      title:
        type: string
    required:
    - deadline
    - title
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.MicrotaskProgress:
    properties:
      completion_ratio:
        type: number
      id:
        type: string
      order:
        type: integer
      posts_count:
        type: integer
      status:
        type: string
      steps_planned:
        type: integer
      title:
        type: string
    type: object
  dto.MicrotaskResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      order:
        type: integer
      promise_id:
        type: string
      status:
        type: string
      steps_planned:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.MyProfileResponse:
    properties:
      avatar_url:
        type: string
      badges_count:
        type: integer
      bio:
        type: string
      email:
        type: string
      followers_count:
        type: integer
      following_count:
        type: integer
      id:
        description: UUID юзера
        type: string
      promises_count:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  dto.PostLiteResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/dto.AttachmentResponse'
        type: array
      author_id:
        type: string
      avatar_url:
        type: string
      comments:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_liked_by_me:
        type: boolean
      is_private:
        type: boolean
      likes:
        type: integer
      microtask_id:
        type: string
      microtask_title:
        type: string
      promise_id:
        type: string
      promise_title:
        type: string
      username:
        type: string
    type: object
  dto.PostWithRepliesTreeResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/dto.AttachmentResponse'
        type: array
      author_id:
        type: string
      avatar_url:
        type: string
      comments:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_liked_by_me:
        type: boolean
      is_private:
        type: boolean
      likes:
        type: integer
      microtask_id:
        type: string
      microtask_title:
        type: string
      promise_id:
        type: string
      promise_title:
        type: string
      replies:
        items:
          $ref: '#/definitions/dto.PostWithRepliesTreeResponse'
        type: array
      username:
        type: string
    type: object
  dto.PromiseResponse:
    properties:
      created_at:
        type: string
      deadline:
        type: string
      description:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      status:
        type: string
      title:
        type: string
      username:
        description: можно добавить позже
        type: string
    type: object
  dto.PromiseWithMicrotasksProgressResponse:
    properties:
      deadline:
        type: string
      description:
        type: string
      id:
        type: string
      is_private:
        type: boolean
      microtasks:
        items:
          $ref: '#/definitions/dto.MicrotaskProgress'
        type: array
      status:
        type: string
      title:
        type: string
    type: object
  dto.PublicProfileResponse:
    properties:
      avatar_url:
        type: string
      badges_count:
        type: integer
      bio:
        type: string
      followers_count:
        type: integer
      following_count:
        type: integer
      id:
        type: string
      is_following:
        type: boolean
      promises_count:
        type: integer
      username:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.ReorderMicrotasksMapRequest:
    properties:
      orders:
        additionalProperties:
          type: integer
        type: object
    required:
    - orders
    type: object
  dto.SignupRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - confirm_password
    - email
    - password
    - username
    type: object
  dto.UpdateMicrotaskRequest:
    properties:
      status:
        enum:
        - pending
        - in_progress
        - completed
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  dto.UpdatePostRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        description: необязательное описание
        maxLength: 160
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    type: object
  dto.UpdatePromiseRequest:
    properties:
      deadline:
        type: string
      description:
        maxLength: 2000
        type: string
      is_private:
        type: boolean
      title:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  dto.UpdateUserRequest:
    properties:
      avatar_url:
        description: Новый аватар
        type: string
      role:
        description: Только для админа
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    type: object
  dto.UserLiteResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      code:
        example: 404
        type: integer
      message:
        example: user not found
        type: string
      status:
        example: error
        type: string
    type: object
  utils.SuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      status:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для отслеживания обещаний пользователей.
  title: iPromise API
  version: "1.0"
paths:
  /attachments/{id}:
    delete:
      description: Удаляет вложение из MinIO и базы данных
      parameters:
      - description: ID вложения
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Удалено'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить вложение по ID
      tags:
      - attachments
  /auth/login:
    post:
      consumes:
      - application/json
      description: Логин по email и паролю, выдаёт JWT токены
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'access_token: токен, refresh_token: токен'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка валидации'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неверный email или пароль'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Авторизация пользователя
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Удаляет Refresh Token из хранилища
      parameters:
      - description: Refresh Token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Вы успешно вышли из системы'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка валидации'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Недействительный Refresh-токен'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Выход из системы
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Использует Refresh Token для выдачи нового Access Token
      parameters:
      - description: Refresh Token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'access_token: новый access-токен'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка валидации'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Недействительный Refresh-токен'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновление Access Token
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя по email, имени и паролю
      parameters:
      - description: Данные для регистрации пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Пользователь зарегистрирован'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверные данные'
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'error: Email или имя пользователя уже занято'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация нового пользователя
      tags:
      - auth
  /badges:
    get:
      description: Возвращает список всех доступных бейджей системы
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BadgeResponse'
            type: array
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить все бейджи
      tags:
      - badges
  /badges/me:
    get:
      description: Возвращает список бейджей, полученных текущим авторизованным пользователем
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.BadgeResponse'
            type: array
        "401":
          description: 'error: Требуется авторизация'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить бейджи текущего пользователя
      tags:
      - badges
  /follow/{username}:
    delete:
      description: Удаляет подписку на указанного пользователя
      parameters:
      - description: Username, от кого отписаться
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Unfollowed successfully'
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 'error: Не подписан на этого пользователя или пытаешься отписаться
            от себя'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: 'error: Неавторизован'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: 'error: Пользователь не найден'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: 'error: Внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отписаться от пользователя
      tags:
      - follow
    post:
      description: Авторизованный пользователь отправляет запрос на подписку другому
        пользователю
      parameters:
      - description: Username, кому отправить запрос
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Follow request sent'
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 'error: Уже подписан или нельзя подписаться на себя'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: 'error: Неавторизован'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: 'error: Пользователь не найден'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: 'error: Внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправить запрос на подписку
      tags:
      - follow
  /follow/{username}/accept:
    post:
      description: Подтверждает входящий запрос на подписку от указанного пользователя
      parameters:
      - description: Username отправителя запроса
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Follow request accepted'
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 'error: Нет ожидающего запроса от пользователя'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: 'error: Неавторизован'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: 'error: Пользователь не найден'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: 'error: Внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Принять запрос на подписку
      tags:
      - follow
  /follow/{username}/decline:
    post:
      description: Отклоняет входящий запрос на подписку от указанного пользователя
      parameters:
      - description: Username отправителя запроса
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Follow request declined'
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 'error: Нет ожидающего запроса от пользователя'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: 'error: Неавторизован'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: 'error: Пользователь не найден'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: 'error: Внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отклонить запрос на подписку
      tags:
      - follow
  /follow/recommended:
    get:
      description: Возвращает список пользователей с общими друзьями, затем случайных
      parameters:
      - description: Максимум пользователей
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339) для пагинации
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserLiteResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Рекомендуемые друзья
      tags:
      - follow
  /follow/requests:
    get:
      description: Возвращает список пользователей, которые отправили запрос на добавление
        в друзья (ожидают подтверждения)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserLiteResponse'
                  type: array
              type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: 'error: Внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить входящие заявки в друзья
      tags:
      - follow
  /follow/requests/{username}/cancel:
    delete:
      description: Удаляет запрос на подписку, если он ещё не принят (status = "pending")
      parameters:
      - description: Username пользователя, которому был отправлен запрос
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: 'message: Запрос отменён'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный формат'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Отменить запрос на подписку
      tags:
      - follows
  /follow/requests/sent:
    get:
      description: Возвращает список пользователей, которым текущий пользователь отправил
        follow-запросы
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserLiteResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправленные заявки в друзья
      tags:
      - follow
  /friends/{username}:
    get:
      description: Возвращает список пользователей, у которых с данным пользователем
        установлена взаимная подписка (дружба)
      parameters:
      - description: Username пользователя, чьих друзей получить
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список взаимных друзей
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserLiteResponse'
                  type: array
              type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: 'error: Пользователь не найден'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: 'error: Внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить список друзей (взаимных подписок)
      tags:
      - follow
  /microtasks/{id}:
    delete:
      description: Удаляет микротаск (soft delete)
      parameters:
      - description: ID микротаска
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
