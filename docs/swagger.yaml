          $ref: '#/definitions/dto.CreateMicrotaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Микротаск создан'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Ошибка запроса'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет прав доступа'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
