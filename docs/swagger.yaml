      responses:
        "200":
          description: 'message: Профиль обновлён'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Некорректные данные профиля'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
