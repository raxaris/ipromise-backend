      tags:
      - promises
  /promises/{id}:
    delete:
      description: Удаляет обещание, если пользователь является владельцем
      parameters:
      - description: ID обещания
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Обещание удалено'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный формат ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет прав'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить обещание
      tags:
      - promises
    get:
      description: Возвращает конкретное обещание (если оно публичное, пользователь
        — владелец или подписчик)
      parameters:
      - description: ID обещания (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PromiseResponse'
        "400":
          description: 'error: Некорректный ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет доступа'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error: Обещание не найдено'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить обещание по ID
      tags:
      - promises
    patch:
      consumes:
      - application/json
      description: Обновляет название, описание или дедлайн обещания
      parameters:
      - description: ID обещания
        in: path
        name: id
        required: true
        type: string
      - description: Обновлённые данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePromiseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Обещание обновлено'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверные данные'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Неавторизован'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет доступа'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновить обещание
      tags:
      - promises
  /promises/{promise_id}/microtasks:
