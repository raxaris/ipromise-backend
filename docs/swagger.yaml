  /users/{id}:
    patch:
      consumes:
      - application/json
      description: Обновляет профиль пользователя (username, role), доступно владельцу
        или админу
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      - description: Новые данные пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Профиль обновлен'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Неверный формат данных'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Нет прав на редактирование'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Ошибка сервера'
          schema:
            additionalProperties:
              type: string
            type: object
