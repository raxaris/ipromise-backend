        in: path
        name: username
        required: true
        type: string
      - description: Лимит
        in: query
        name: limit
        type: integer
      - description: Дата (RFC3339) для пагинации
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PromiseResponse'
