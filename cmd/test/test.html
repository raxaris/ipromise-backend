<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Auth Test</title>
</head>
<body>
<h1>Login + WebSocket Test</h1>

<label>Email: <input id="email" type="text" value="emanuelneuer@example.com"></label><br>
<label>Password: <input id="password" type="password" value="Password123"></label><br>
<button onclick="login()">Login</button>

<hr>

<button onclick="connectWS()">Connect WebSocket</button>
<pre id="output">Waiting for messages...\n</pre>

<script>
    function login() {
        fetch("http://localhost:8080/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include", // 💡 критично: отправлять и сохранять куки
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById("output").textContent += "✅ Logged in\n";
                console.log("Login success", data);
            })
            .catch(err => {
                document.getElementById("output").textContent += "❌ Login failed\n";
                console.error(err);
            });
    }

    function connectWS() {
        const socket = new WebSocket("ws://localhost:8080/ws/notifications");

        socket.onopen = () => {
            document.getElementById("output").textContent += "✅ WebSocket connected\n";
        };

        socket.onmessage = (event) => {
            document.getElementById("output").textContent += "📩 " + event.data + "\n";
        };

        socket.onerror = () => {
            document.getElementById("output").textContent += "❌ WebSocket error\n";
        };

        socket.onclose = () => {
            document.getElementById("output").textContent += "🔌 WebSocket closed\n";
        };
    }
</script>
</body>
</html>
